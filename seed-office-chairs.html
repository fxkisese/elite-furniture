        transport_method: 'Pickup Van',
      },
    ];

    const log = (msg, isErr = false) => {
      const el = document.getElementById('log');
      el.innerHTML += `<span class="${isErr ? 'error' : ''}">${msg}\n</span>`;
    };

    async function seed() {
      const btn = document.getElementById('btn');
      btn.disabled = true;
      document.getElementById('log').innerHTML = '';
      log('Starting seed...\n');

      for (const product of products) {
        log(`➤ Inserting: ${product.name}...`);
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/products`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`,
              'Prefer': 'return=representation',
            },
            body: JSON.stringify(product),
          });
          const data = await res.json();
          if (!res.ok) {
            log(`  ❌ Error: ${JSON.stringify(data)}`, true);
          } else {
            log(`  ✅ Done! ID: ${data[0]?.id}`);
          }
        } catch (err) {
          log(`  ❌ Network error: ${err.message}`, true);
        }
      }

      log('\n🎉 All done! Refresh your products page to see the new chairs.');
      btn.disabled = false;
    }
  </script>
